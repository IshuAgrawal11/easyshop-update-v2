apiVersion: 1
datasources:
  # Fixed uids (rather than letting Grafana auto-generate one) so the
  # custom dashboards below, which reference these uids directly, keep
  # working across a fresh `docker compose down -v && up` cycle.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
