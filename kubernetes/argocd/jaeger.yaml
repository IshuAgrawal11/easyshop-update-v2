apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
spec:
  project: easyshop
  source:
    repoURL: https://jaegertracing.github.io/helm-charts
    chart: jaeger
    targetRevision: 4.11.2
    helm:
      values: |
        # Jaeger v2 is built on the OpenTelemetry Collector core, so its
        # config uses the OTel Collector receiver/processor/exporter/service
        # format rather than the old v1 SPAN_STORAGE_TYPE env vars.
        userconfig:
          service:
            extensions: [jaeger_storage, jaeger_query, healthcheckv2]
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [jaeger_storage_exporter]
            telemetry:
              resource:
                service.name: jaeger
              metrics:
                level: detailed
                readers:
                  - pull:
                      exporter:
                        prometheus:
                          host: 0.0.0.0
                          port: 8888
          extensions:
            healthcheckv2:
              use_v2: true
              http:
                endpoint: 0.0.0.0:13133
            jaeger_query:
              storage:
                traces: primary_store
            jaeger_storage:
              backends:
                primary_store:
                  badger:
                    directories:
                      keys: /badger/keys
                      values: /badger/values
                    ephemeral: false
                    ttl:
                      spans: 168h
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch: {}
          exporters:
            jaeger_storage_exporter:
              trace_storage: primary_store

        jaeger:
          extraVolumes:
            - name: badger-data
              persistentVolumeClaim:
                claimName: jaeger-badger-data
          extraVolumeMounts:
            - name: badger-data
              mountPath: /badger

        extraObjects:
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: jaeger-badger-data
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: gp3
              resources:
                requests:
                  storage: 10Gi
          - apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: jaeger
              labels:
                release: argocd-monitoring
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: jaeger
              endpoints:
                - port: internal-metrics
                  path: /metrics
                  interval: 30s
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
