apiVersion: v1
kind: ConfigMap
metadata:
  name: easyshop-config
  namespace: easyshop
data:
  MONGODB_URI: "mongodb://mongodb-0.mongodb-service.easyshop.svc.cluster.local:27017/easyshop"
  REDIS_URI: "redis://easyshop-redis.easyshop.svc.cluster.local:6379"
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://easyshop.letsdeployit.com/api"
  NEXTAUTH_URL: "https://easyshop.letsdeployit.com"
  # NEXTAUTH_SECRET / JWT_SECRET intentionally NOT here - ConfigMaps are
  # plaintext and readable by anyone with configmap `get` RBAC. Those two
  # values live only in the Secret (05-secrets.yaml).
