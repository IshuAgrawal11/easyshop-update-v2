apiVersion: 1

datasources:
  # Explicit, stable uids so dashboard JSON can reference them directly
  # (datasource-uid: Xxx) without breaking every time Grafana re-provisions
  # (e.g. after a volume wipe), since Grafana otherwise auto-generates a new
  # random uid per provisioning run.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
