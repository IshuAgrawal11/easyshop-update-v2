apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easyshop
  namespace: argocd
spec:
  project: easyshop
  source:
    # TODO: point at your own fork/repo before applying.
    repoURL: https://github.com/<YOUR_GITHUB_ORG>/<YOUR_REPO>.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: easyshop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true