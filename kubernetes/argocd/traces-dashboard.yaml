# Picked up automatically by the Grafana sidecar (grafana_dashboard: "1",
# searchNamespace: ALL is enabled by default in kube-prometheus-stack). See
# golden-signals-dashboard.yaml for the namespace-ordering caveat - same
# applies here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: easyshop-traces-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  easyshop-traces.json: |
    {
      "id": null,
      "uid": "easyshop-traces",
      "title": "EasyShop Traces",
      "description": "Browse recent traces and look up a specific trace by ID via Jaeger, without leaving Grafana.",
      "tags": ["easyshop", "jaeger", "traces"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "traceID",
            "type": "textbox",
            "label": "Trace ID (paste one from the panel below)",
            "current": { "text": "", "value": "" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "traces",
          "title": "Recent Traces (service: easyshop)",
          "description": "Click a trace to expand its full span waterfall inline.",
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "jaeger", "uid": "jaeger" },
          "targets": [
            {
              "queryType": "search",
              "service": "easyshop",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "traces",
          "title": "Look up Trace by ID",
          "description": "Set the traceID dashboard variable above to a specific trace ID to jump straight to it.",
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 14 },
          "datasource": { "type": "jaeger", "uid": "jaeger" },
          "targets": [
            {
              "queryType": "traceID",
              "query": "$traceID",
              "refId": "A"
            }
          ]
        }
      ]
    }
    
