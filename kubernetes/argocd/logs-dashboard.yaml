# Picked up automatically by the Grafana sidecar (grafana_dashboard: "1",
# searchNamespace: ALL is enabled by default in kube-prometheus-stack). See
# golden-signals-dashboard.yaml for the namespace-ordering caveat - same
# applies here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: easyshop-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  easyshop-logs.json: |
    {
      "id": null,
      "uid": "easyshop-logs",
      "title": "EasyShop Logs",
      "description": "Browse and search application/infrastructure logs via Loki, without leaving Grafana.",
      "tags": ["easyshop", "loki", "logs"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "container",
            "type": "query",
            "datasource": "Loki",
            "query": "label_values(container)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Log Volume by Container",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 0 },
          "datasource": "Loki",
          "targets": [
            {
              "expr": "sum by (container) (count_over_time({container=~\"$container\"}[1m]))",
              "legendFormat": "{{container}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error Log Rate",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 0 },
          "datasource": "Loki",
          "targets": [
            {
              "expr": "sum(count_over_time({container=~\"$container\"} |~ \"(?i)error\" [1m]))",
              "legendFormat": "errors/min"
            }
          ],
          "fieldConfig": {
            "defaults": { "color": { "mode": "fixed", "fixedColor": "red" } },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "logs",
          "title": "Live Logs",
          "description": "Filter by container using the dropdown above. Search text using |~ \"pattern\" in the query.",
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 7 },
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{container=~\"$container\"}"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        }
      ]
    }
    
