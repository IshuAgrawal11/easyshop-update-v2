apiVersion: v1
kind: Secret
metadata:
  name: easyshop-secrets
  namespace: easyshop
type: Opaque
stringData:
  JWT_SECRET: "***REMOVED-JWT-SECRET***"
  NEXTAUTH_SECRET: "***REMOVED-NEXTAUTH-SECRET***"
  # MongoDB now requires authentication on EKS too (previously it had none —
  # any pod in the cluster could connect with full read/write access). Fill
  # in real generated values before applying; MONGODB_URI must embed the
  # same password as MONGO_APP_PASSWORD below (plain YAML can't reference
  # its own other keys).
  MONGO_INITDB_ROOT_PASSWORD: "REPLACE_WITH_ROOT_PASSWORD"
  MONGO_APP_PASSWORD: "REPLACE_WITH_APP_PASSWORD"
  MONGODB_URI: "mongodb://easyshop_app:REPLACE_WITH_APP_PASSWORD@mongodb-service:27017/easyshop?authSource=easyshop"
  # Read-only clusterMonitor-role user for mongodb-exporter — deliberately
  # separate from the app's readWrite user above.
  MONGO_EXPORTER_PASSWORD: "REPLACE_WITH_EXPORTER_PASSWORD"
  MONGODB_EXPORTER_URI: "mongodb://mongodb_exporter:REPLACE_WITH_EXPORTER_PASSWORD@mongodb-service:27017/admin?authSource=admin"
  # Bearer token Prometheus sends to scrape /api/metrics. Generate with: openssl rand -hex 32
  METRICS_TOKEN: "REPLACE_WITH_OPENSSL_RAND_HEX_32"