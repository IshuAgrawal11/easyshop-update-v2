# These are placeholders. Set real values at deploy time - e.g.
#   kubectl -n easyshop create secret generic easyshop-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=NEXTAUTH_SECRET=$(openssl rand -base64 32) \
#     --dry-run=client -o yaml | kubectl apply -f -
# or manage this via sealed-secrets / External Secrets Operator / SOPS for
# GitOps - never commit real secret values in plaintext to this file.
apiVersion: v1
kind: Secret
metadata:
  name: easyshop-secrets
  namespace: easyshop
type: Opaque
stringData:
  JWT_SECRET: "change-this-in-production"
  NEXTAUTH_SECRET: "change-this-in-production"