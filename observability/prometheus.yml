global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: easyshop-app
    metrics_path: /api/metrics
    # Prometheus's own config format has no environment-variable
    # interpolation — the real token is written to this file at container
    # startup (see the `command` override in docker-compose.yml) rather than
    # committed here.
    bearer_token_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["app:3000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own self-observability metrics (spans received/exported,
  # queue sizes) — a distinct endpoint from the one above, which only carries
  # metrics forwarded *through* the collector's OTLP pipeline. Feeds the
  # community "OpenTelemetry Collector" Grafana dashboard.
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: mongodb-exporter
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
