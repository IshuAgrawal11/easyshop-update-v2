receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    # Nothing emits OTLP metrics today (the app exports Prometheus-format
    # metrics directly via /api/metrics instead) — this pipeline is here so
    # any future service that does emit OTLP metrics has somewhere to go
    # without needing a collector config change.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
