receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    # Nothing emits OTLP metrics today (the app exports Prometheus-format
    # metrics directly via /api/metrics instead) — this pipeline is here so
    # any future service that does emit OTLP metrics has somewhere to go
    # without needing a collector config change.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
  # The collector's own self-observability (spans received/exported, queue
  # sizes, refused/dropped counts) — separate from the "prometheus" exporter
  # above, which only carries metrics *forwarded through* the collector.
  # This is what the community "OpenTelemetry Collector" Grafana dashboard
  # (grafana.com/dashboards/15983) actually reads from.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
